# Shared look for the lock screen (hyprlock) and the login greeter (hyprlogin).
# Both source this file, so the two screens cannot drift apart.
#
# $wallpaper is defined by whichever config sources this one, because the paths
# differ: hyprlock reads the image from $HOME, the greeter from /usr/share/hyprlogin.
#
# Name the font family, never the generic "Monospace" alias: fontconfig resolves
# that to Noto Sans Mono CJK KR here (/etc/fonts/conf.d/65-nonlatin.conf), and the
# greeter runs as another user, so a per-user fontconfig preference would not reach it.
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks

$font = JetBrainsMonoNL Nerd Font

general {
    hide_cursor = false
    ignore_empty_input = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    # color = rgb(0, 0, 0)
    # blur_passes = 3
    path = $wallpaper
}

input-field {
    monitor = DP-1
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 1.0) # no fill

    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $FAIL # not $PAMFAIL: the greeter authenticates through greetd, not PAM

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor = DP-1
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor = DP-1
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}
