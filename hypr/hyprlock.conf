# hyprlock — lock screen
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# The look lives in hyprlock-theme.conf, shared with the hyprlogin greeter.
# This file only picks the wallpaper and adds lock-screen-only settings.
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace

$wallpaper = $HOME/.config/wallpapers/ArtemisII/art002e021278~large.jpg
source = hyprlock-theme.conf

# uncomment to enable fingerprint authentication
# auth {
