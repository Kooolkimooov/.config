# hyprlogin — greetd greeter, installed to /etc/hyprlogin/hyprlogin.conf by set_config.
# Same look as the lock screen, plus the bits only a greeter needs.
#
# shortcuts:
# - ESC on an empty password field returns to username entry
# - ESC / Ctrl+U / Ctrl+Backspace clear the current field
# - Tab / Shift+Tab cycle the selected session
#
# The theme copy sits next to this file in /etc/hyprlogin, so the relative source
# below resolves there. The image is whatever hyprlock.conf points at; set_config
# copies it to the path set here (extensionless: hyprgraphics sniffs the content).

$wallpaper = /usr/share/hyprlogin/wallpaper
source = hyprlock-theme.conf

general:immediate_render = true
general:fail_timeout = 4000
general:exit_command = hyprctl eval 'hl.dispatch(hl.dsp.exit())' # tears down the greeter compositor after login

# debugging a failed login: set these, re-run set_config, read the log afterwards
# general:debug_mode = true
# general:debug_log_path = /tmp/hyprlogin-debug.log

sessions {
    default_user = martin
    default_session = hyprland.desktop
}

# session indicator, bottom-left; Tab / Shift+Tab or click to cycle
label {
    monitor = DP-1
    text = $GREETD_SESSION
    font_size = 16
    font_family = $font
    color = rgba(200, 200, 200, 1.0)
    onclick = hyprlogin:session_next

    position = 30, 30
    halign = left
    valign = bottom
}
