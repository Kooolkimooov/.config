# greetd — installed to /etc/greetd/config.toml by set_config.
#
# vt = 1 is the live setting; ly@tty1 must be disabled or the two fight over VT1.
# Set vt = 2 to test a greeter change on a spare TTY while the desktop keeps VT1.

[terminal]
vt = 1

[default_session]
command = "start-hyprland -- --config /etc/hyprlogin/hyprland-greeter.lua"
user = "greeter"
